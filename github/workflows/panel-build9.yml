name: Build bottom panel APK

'on':
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Android project
        shell: bash
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          mkdir -p panel/app/src/main/java/com/example/panel
          mkdir -p panel/app/src/main/res/xml
          mkdir -p panel/app/src/main/res/values

          cd panel

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Panel"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.panel'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.example.panel'
                  minSdk 29
                  targetSdk 29
                  versionCode 1
                  versionName '1.5'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Bottom Panel</string>
              <string name="accessibility_desc">Keeps the bottom panel alive and displays it automatically after sleep.</string>
          </resources>
          EOF

          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault"
              android:canRetrieveWindowContent="false"
              android:description="@string/accessibility_desc"
              android:notificationTimeout="100" />
          EOF

          # IMPORTANT:
          # Add the complete AndroidManifest.xml and the four Java files
          # from your existing working project here:
          # MainActivity.java
          # AppsActivity.java
          # PanelService.java
          # BootReceiver.java
          # PanelAccessibilityService.java

      - name: Build APK
        working-directory: panel
        run: |
          gradle --version
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bottom-panel-apk
          path: panel/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK as a release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: panel-${{ github.run_number }}
          name: Bottom Panel APK ${{ github.run_number }}
          files: panel/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
