name: Build bottom panel APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Reuse the same signing key between builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Create project files
        run: |
          mkdir -p panel/app/src/main/java/com/example/panel
          cd panel

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Panel"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.example.panel'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.example.panel'
                  minSdk 29
                  targetSdk 29
                  versionCode 2
                  versionName '1.1'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <application
                  android:label="Bottom Panel"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity
                      android:name=".AppsActivity"
                      android:exported="false"
                      android:theme="@android:style/Theme.Material.NoActionBar" />
                  <service
                      android:name=".PanelService"
                      android:exported="false" />
                  <receiver
                      android:name=".BootReceiver"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/panel/BootReceiver.java <<'EOF'
          package com.example.panel;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.provider.Settings;

          public class BootReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context c, Intent i) {
                  SharedPreferences p = c.getSharedPreferences("p", 0);
                  boolean ping = "com.example.panel.PING".equals(i.getAction());
                  if (ping) {
                      if (!p.getBoolean("wanted", false)) return;
                  } else if (!p.getBoolean("boot", true)) {
                      return;
                  }
                  if (!Settings.canDrawOverlays(c)) return;
                  if (!ping) PanelService.log(c, "boot broadcast received");
                  Intent s = new Intent(c, PanelService.class);
                  if (ping) s.setAction("ping");
                  c.startForegroundService(s);
              }
          }
          EOF

          cat > app/src/main/java/com/example/panel/PanelService.java <<'EOF'
          package com.example.panel;

          import android.app.AlarmManager;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.graphics.PixelFormat;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.net.Uri;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.os.SystemClock;
          import android.provider.Settings;
          import android.util.DisplayMetrics;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.TextClock;
          import android.widget.TextView;
          import android.widget.Toast;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;

          public class PanelService extends Service {
              private static final int W = ViewGroup.LayoutParams.WRAP_CONTENT;
              private static final int M = ViewGroup.LayoutParams.MATCH_PARENT;
              private static String lastMsg = null;

              private WindowManager wm;
              private View panel;
              private View handle;
              private boolean hidden = false;
              private float dens = 1f;
              private final Handler handler = new Handler(Looper.getMainLooper());
              private final Runnable watchdog = new Runnable() {
                  @Override
                  public void run() {
                      check();
                      handler.postDelayed(this, 1500);
                  }
              };

              public static void log(Context c, String m) {
                  if (m.equals(lastMsg)) return;
                  lastMsg = m;
                  SharedPreferences p = c.getSharedPreferences("p", 0);
                  String line = new SimpleDateFormat("HH:mm:ss", Locale.US).format(new Date()) + " " + m;
                  String[] old = p.getString("log", "").split("\n");
                  StringBuilder sb = new StringBuilder(line);
                  for (int k = 0; k < old.length && k < 11; k++) {
                      if (!old[k].isEmpty()) sb.append("\n").append(old[k]);
                  }
                  p.edit().putString("log", sb.toString()).apply();
              }

              private static PendingIntent pingIntent(Context c) {
                  Intent i = new Intent(c, BootReceiver.class);
                  i.setAction("com.example.panel.PING");
                  return PendingIntent.getBroadcast(c, 0, i, PendingIntent.FLAG_UPDATE_CURRENT);
              }

              public static void schedulePing(Context c) {
                  AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
                  am.setInexactRepeating(AlarmManager.ELAPSED_REALTIME,
                          SystemClock.elapsedRealtime() + 60000, 60000, pingIntent(c));
              }

              public static void cancelPing(Context c) {
                  AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
                  am.cancel(pingIntent(c));
              }

              @Override
              public IBinder onBind(Intent i) {
                  return null;
              }

              @Override
              public int onStartCommand(Intent i, int f, int id) {
                  boolean ping = i != null && "ping".equals(i.getAction());
                  NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                  nm.createNotificationChannel(new NotificationChannel("panel", "Bottom panel",
                          NotificationManager.IMPORTANCE_MIN));
                  Notification n = new Notification.Builder(this, "panel")
                          .setContentTitle("Bottom panel is running")
                          .setSmallIcon(android.R.drawable.ic_dialog_info)
                          .build();
                  startForeground(1, n);
                  if (!Settings.canDrawOverlays(this)) {
                      log(this, "overlay permission missing");
                      stopSelf();
                      return START_NOT_STICKY;
                  }
                  wm = (WindowManager) getSystemService(WINDOW_SERVICE);
                  dens = getResources().getDisplayMetrics().density;
                  getSharedPreferences("p", 0).edit().putBoolean("wanted", true).apply();
                  schedulePing(this);
                  if (ping && (panel != null || handle != null)) {
                      return START_STICKY;
                  }
                  log(this, i == null ? "service restarted by system"
                          : ping ? "service revived by keep-alive" : "service started");
                  hidden = false;
                  build();
                  handler.removeCallbacks(watchdog);
                  handler.postDelayed(watchdog, 1500);
                  return START_STICKY;
              }

              @Override
              public void onDestroy() {
                  handler.removeCallbacks(watchdog);
                  log(this, "service destroyed");
                  clear();
                  super.onDestroy();
              }

              private void check() {
                  if (wm == null) return;
                  if (hidden) {
                      if (handle != null && handle.isAttachedToWindow()) {
                          lastMsg = null;
                      } else {
                          log(this, "handle missing - re-adding");
                          build();
                      }
                  } else {
                      if (panel != null && panel.isAttachedToWindow()) {
                          lastMsg = null;
                      } else {
                          log(this, "panel window gone - re-adding");
                          build();
                      }
                  }
              }

              private int px(float dp) {
                  return Math.round(dp * dens);
              }

              private void remove(View v) {
                  if (v != null && wm != null) {
                      try {
                          wm.removeView(v);
                      } catch (Exception ignored) {
                      }
                  }
              }

              private void clear() {
                  remove(panel);
                  remove(handle);
                  panel = null;
                  handle = null;
              }

              private WindowManager.LayoutParams lp(int w, int h, int gravity, int x, int y) {
                  WindowManager.LayoutParams l = new WindowManager.LayoutParams(w, h,
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                                  | WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL
                                  | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN
                                  | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                          PixelFormat.OPAQUE);
                  l.gravity = gravity;
                  l.x = x;
                  l.y = y;
                  return l;
              }

              private void build() {
                  clear();
                  SharedPreferences p = getSharedPreferences("p", 0);
                  int hDp = p.getInt("height", 170);
                  int sDp = p.getInt("side", 200);
                  DisplayMetrics real = new DisplayMetrics();
                  wm.getDefaultDisplay().getRealMetrics(real);
                  if (hidden) {
                      addHandle(real);
                  } else {
                      addPanel(real, hDp, sDp);
                  }
              }

              private void addHandle(DisplayMetrics real) {
                  TextView t = new TextView(this);
                  t.setText("Show panel");
                  t.setTextColor(Color.WHITE);
                  t.setTextSize(16);
                  t.setGravity(Gravity.CENTER);
                  t.setBackgroundColor(Color.rgb(60, 66, 76));
                  t.setOnClickListener(v -> {
                      hidden = false;
                      build();
                  });
                  int h = px(44);
                  try {
                      wm.addView(t, lp(px(150), h, Gravity.TOP | Gravity.CENTER_HORIZONTAL, 0, real.heightPixels - h));
                      handle = t;
                  } catch (Exception e) {
                      log(this, "handle addView failed: " + e);
                  }
              }

              private void addPanel(DisplayMetrics real, int hDp, int sDp) {
                  int h = px(hDp);
                  int size = px(Math.max(40, Math.min(100, hDp - 20)));
                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(Color.rgb(16, 20, 24));
                  root.setPadding(px(sDp), 0, px(sDp), 0);

                  LinearLayout left = row();
                  left.addView(tile("Home", Color.rgb(240, 110, 60), size, v -> goHome()));
                  left.addView(tile("Apps", Color.rgb(40, 110, 230), size,
                          v -> go(new Intent(this, AppsActivity.class))));
                  root.addView(left, new FrameLayout.LayoutParams(W, W, Gravity.START | Gravity.CENTER_VERTICAL));

                  LinearLayout clock = new LinearLayout(this);
                  clock.setOrientation(LinearLayout.VERTICAL);
                  clock.setGravity(Gravity.CENTER_HORIZONTAL);
                  TextClock time = new TextClock(this);
                  time.setFormat12Hour("h:mm");
                  time.setFormat24Hour("HH:mm");
                  time.setTextColor(Color.WHITE);
                  time.setTextSize(44);
                  time.setTypeface(Typeface.DEFAULT_BOLD);
                  time.setGravity(Gravity.CENTER);
                  TextClock date = new TextClock(this);
                  date.setFormat12Hour("EEE, d MMM yyyy");
                  date.setFormat24Hour("EEE, d MMM yyyy");
                  date.setTextColor(Color.rgb(180, 190, 200));
                  date.setTextSize(16);
                  date.setGravity(Gravity.CENTER);
                  clock.addView(time, new LinearLayout.LayoutParams(W, W));
                  clock.addView(date, new LinearLayout.LayoutParams(W, W));
                  root.addView(clock, new FrameLayout.LayoutParams(W, W, Gravity.CENTER));

                  LinearLayout right = row();
                  right.addView(tile("Maps", Color.rgb(0, 150, 160), size, v -> openMaps()));
                  right.addView(tile("Phone", Color.rgb(50, 180, 70), size,
                          v -> go(new Intent(Intent.ACTION_DIAL))));
                  right.addView(tile("Hide", Color.rgb(90, 98, 110), size, v -> {
                      hidden = true;
                      build();
                  }));
                  root.addView(right, new FrameLayout.LayoutParams(W, W, Gravity.END | Gravity.CENTER_VERTICAL));

                  try {
                      wm.addView(root, lp(M, h, Gravity.TOP | Gravity.LEFT, 0, real.heightPixels - h));
                      panel = root;
                  } catch (Exception e) {
                      log(this, "panel addView failed: " + e);
                  }
              }

              private LinearLayout row() {
                  LinearLayout l = new LinearLayout(this);
                  l.setOrientation(LinearLayout.HORIZONTAL);
                  l.setGravity(Gravity.CENTER_VERTICAL);
                  return l;
              }

              private TextView tile(String label, int color, int size, View.OnClickListener l) {
                  TextView t = new TextView(this);
                  t.setText(label);
                  t.setTextColor(Color.WHITE);
                  t.setTextSize(17);
                  t.setTypeface(Typeface.DEFAULT_BOLD);
                  t.setGravity(Gravity.CENTER);
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(color);
                  g.setCornerRadius(px(16));
                  t.setBackground(g);
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(size, size);
                  p.setMargins(px(6), 0, px(6), 0);
                  t.setLayoutParams(p);
                  t.setOnClickListener(l);
                  return t;
              }

              private void go(Intent i) {
                  try {
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(i);
                  } catch (Exception e) {
                      Toast.makeText(this, "Cannot open: " + e.getMessage(), Toast.LENGTH_LONG).show();
                  }
              }

              private void goHome() {
                  Intent h = new Intent(Intent.ACTION_MAIN);
                  h.addCategory(Intent.CATEGORY_HOME);
                  go(h);
              }

              private void openMaps() {
                  Intent m = getPackageManager().getLaunchIntentForPackage("com.google.android.apps.maps");
                  if (m == null) {
                      m = new Intent(Intent.ACTION_VIEW, Uri.parse("geo:0,0?q="));
                  }
                  go(m);
              }
          }
          EOF

          cat > app/src/main/java/com/example/panel/AppsActivity.java <<'EOF'
          package com.example.panel;

          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.BaseAdapter;
          import android.widget.GridView;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;
          import java.util.Collections;
          import java.util.List;

          public class AppsActivity extends Activity {
              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  final PackageMa
