<body>name: Build bottom panel APK<br/><br/>on: [push, workflow_dispatch]<br/><br/>permissions:<br/>  contents: write<br/><br/>jobs:<br/>  build:<br/>    runs-on: ubuntu-latest<br/>    steps:<br/>      - uses: actions/checkout@v4<br/><br/>      - uses: actions/setup-java@v4<br/>        with:<br/>          distribution: temurin<br/>          java-version: &#39;17&#39;<br/><br/>      - uses: gradle/actions/setup-gradle@v4<br/>        with:<br/>          gradle-version: &#39;8.4&#39;<br/><br/>      - name: Reuse the same signing key between builds<br/>        uses: actions/cache@v4<br/>        with:<br/>          path: ~/.android/debug.keystore<br/>          key: debug-keystore-v1<br/>          restore-keys: debug-keystore-<br/><br/>      - name: Create project files<br/>        run: |<br/>          mkdir -p panel/app/src/main/java/com/example/panel<br/>          mkdir -p panel/app/src/main/res/xml<br/>          mkdir -p panel/app/src/main/res/values<br/>          cd panel<br/><br/>          cat &gt; settings.gradle &lt;&lt;&#39;EOF&#39;<br/>          pluginManagement {<br/>              repositories { google(); mavenCentral(); gradlePluginPortal() }<br/>          }<br/>          dependencyResolutionManagement {<br/>              repositories { google(); mavenCentral() }<br/>          }<br/>          rootProject.name = &quot;Panel&quot;<br/>          include &#39;:app&#39;<br/>          EOF<br/><br/>          cat &gt; build.gradle &lt;&lt;&#39;EOF&#39;<br/>          plugins {<br/>              id &#39;com.android.application&#39; version &#39;8.2.2&#39; apply false<br/>          }<br/>          EOF<br/><br/>          cat &gt; app/build.gradle &lt;&lt;EOF<br/>          plugins {<br/>              id &#39;com.android.application&#39;<br/>          }<br/>          android {<br/>              namespace &#39;com.example.panel&#39;<br/>              compileSdk 34<br/>              defaultConfig {<br/>                  applicationId &#39;com.example.panel&#39;<br/>                  minSdk 29<br/>                  targetSdk 29<br/>                  versionCode ${GITHUB_RUN_NUMBER:-1}<br/>                  versionName &#39;1.5&#39;<br/>              }<br/>              compileOptions {<br/>                  sourceCompatibility JavaVersion.VERSION_17<br/>                  targetCompatibility JavaVersion.VERSION_17<br/>              }<br/>          }<br/>          EOF<br/><br/>          cat &gt; app/src/main/res/values/strings.xml &lt;&lt;&#39;EOF&#39;<br/>          &lt;resources&gt;<br/>              &lt;string name=&quot;app_name&quot;&gt;Bottom Panel&lt;/string&gt;<br/>              &lt;string name=&quot;accessibility_desc&quot;&gt;Keeps the bottom panel alive and displays it automatically after sleep.&lt;/string&gt;<br/>          &lt;/resources&gt;<br/>          EOF<br/><br/>          cat &gt; app/src/main/res/xml/accessibility_service_config.xml &lt;&lt;&#39;EOF&#39;<br/>          &lt;?xml version=&quot;1.0&quot; encoding=&quot;utf-8&quot;?&gt;<br/>          &lt;accessibility-service xmlns:android=&quot;http://schemas.android.com/apk/res/android&quot;<br/>              android:accessibilityEventTypes=&quot;typeWindowStateChanged&quot;<br/>              android:accessibilityFeedbackType=&quot;feedbackGeneric&quot;<br/>              android:accessibilityFlags=&quot;flagDefault&quot;<br/>              android:canRetrieveWindowContent=&quot;false&quot;<br/>              android:description=&quot;@string/accessibility_desc&quot;<br/>              android:notificationTimeout=&quot;100&quot; /&gt;<br/>          EOF<br/><br/>          cat &gt; app/src/main/AndroidManifest.xml &lt;&lt;&#39;EOF&#39;<br/>          &lt;?xml version=&quot;1.0&quot; encoding=&quot;utf-8&quot;?&gt;<br/>          &lt;manifest xmlns:android=&quot;http://schemas.android.com/apk/res/android&quot;&gt;<br/>              &lt;uses-permission android:name=&quot;android.permission.SYSTEM_ALERT_WINDOW&quot; /&gt;<br/>              &lt;uses-permission android:name=&quot;android.permission.FOREGROUND_SERVICE&quot; /&gt;<br/>              &lt;uses-permission android:name=&quot;android.permission.RECEIVE_BOOT_COMPLETED&quot; /&gt;<br/>              &lt;uses-permission android:name=&quot;android.permission.SCHEDULE_EXACT_ALARM&quot; /&gt;<br/>              &lt;uses-permission android:name=&quot;android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS&quot; /&gt;<br/>              <br/>              &lt;queries&gt;<br/>                  &lt;intent&gt;<br/>                      &lt;action android:name=&quot;android.intent.action.MAIN&quot; /&gt;<br/>                      &lt;category android:name=&quot;android.intent.category.LAUNCHER&quot; /&gt;<br/>                  &lt;/intent&gt;<br/>                  &lt;package android:name=&quot;com.google.android.apps.maps&quot; /&gt;<br/>              &lt;/queries&gt;<br/><br/>              &lt;application<br/>                  android:label=&quot;Bottom Panel&quot;<br/>                  android:theme=&quot;@android:style/Theme.Material.Light.NoActionBar&quot;&gt;<br/>                  &lt;activity<br/>                      android:name=&quot;.MainActivity&quot;<br/>                      android:exported=&quot;true&quot;&gt;<br/>                      &lt;intent-filter&gt;<br/>                          &lt;action android:name=&quot;android.intent.action.MAIN&quot; /&gt;<br/>                          &lt;category android:name=&quot;android.intent.category.LAUNCHER&quot; /&gt;<br/>                      &lt;/intent-filter&gt;<br/>                  &lt;/activity&gt;<br/>                  &lt;activity<br/>                      android:name=&quot;.AppsActivity&quot;<br/>                      android:exported=&quot;false&quot;<br/>                      android:theme=&quot;@android:style/Theme.Material.NoActionBar&quot; /&gt;<br/>                  <br/>                  &lt;service<br/>                      android:name=&quot;.PanelService&quot;<br/>                      android:exported=&quot;false&quot;<br/>                      android:process=&quot;:panel&quot;<br/>                      android:stopWithTask=&quot;false&quot; /&gt;<br/><br/>                  &lt;service<br/>                      android:name=&quot;.PanelAccessibilityService&quot;<br/>                      android:exported=&quot;true&quot;<br/>                      android:permission=&quot;android.permission.BIND_ACCESSIBILITY_SERVICE&quot;&gt;<br/>                      &lt;intent-filter&gt;<br/>                          &lt;action android:name=&quot;android.accessibilityservice.AccessibilityService&quot; /&gt;<br/>                      &lt;/intent-filter&gt;<br/>                      &lt;meta-data<br/>                          android:name=&quot;android.accessibilityservice&quot;<br/>                          android:resource=&quot;@xml/accessibility_service_config&quot; /&gt;<br/>                  &lt;/service&gt;<br/><br/>                  &lt;receiver<br/>                      android:name=&quot;.BootReceiver&quot;<br/>                      android:exported=&quot;true&quot;&gt;<br/>                      &lt;intent-filter&gt;<br/>                          &lt;action android:name=&quot;android.intent.action.BOOT_COMPLETED&quot; /&gt;<br/>                          &lt;action android:name=&quot;android.intent.action.QUICKBOOT_POWERON&quot; /&gt;<br/>                          &lt;action android:name=&quot;com.htc.intent.action.QUICKBOOT_POWERON&quot; /&gt;<br/>                          &lt;action android:name=&quot;android.intent.action.USER_PRESENT&quot; /&gt;<br/>                          <br/>                          &lt;action android:name=&quot;com.nwd.action.ACC_ON&quot; /&gt;<br/>                          &lt;action android:name=&quot;com.nwd.action.SLEEP_OUT&quot; /&gt;<br/>                          &lt;action android:name=&quot;com.nwd.action.POWER_ON&quot; /&gt;<br/>                          &lt;action android:name=&quot;android.intent.action.ACC_ON&quot; /&gt;<br/>                          &lt;action android:name=&quot;com.tw.action.ACC_ON&quot; /&gt;<br/>                          &lt;action android:name=&quot;com.ivy.action.ACC_ON&quot; /&gt;<br/>                          <br/>                          &lt;action android:name=&quot;android.net.conn.CONNECTIVITY_CHANGE&quot; /&gt;<br/>                          &lt;action android:name=&quot;android.intent.action.TIME_SET&quot; /&gt;<br/>                          &lt;action android:name=&quot;android.intent.action.TIMEZONE_CHANGED&quot; /&gt;<br/>                          &lt;action android:name=&quot;android.intent.action.ACTION_POWER_CONNECTED&quot; /&gt;<br/>                      &lt;/intent-filter&gt;<br/>                  &lt;/receiver&gt;<br/>              &lt;/application&gt;<br/>          &lt;/manifest&gt;<br/>          EOF<br/><br/>          cat &gt; app/src/main/java/com/example/panel/BootReceiver.java &lt;&lt;&#39;EOF&#39;<br/>          package com.example.panel;<br/><br/>          import android.content.BroadcastReceiver;<br/>          import android.content.Context;<br/>          import android.content.Intent;<br/>          import android.provider.Settings;<br/><br/>          public class BootReceiver extends BroadcastReceiver {<br/>              @Override<br/>              public void onReceive(Context c, Intent i) {<br/>                  String action = i == null ? &quot;(null intent)&quot; : String.valueOf(i.getAction());<br/>                  boolean ping = &quot;com.example.panel.PING&quot;.equals(action);<br/>                  <br/>                  PanelService.log(c, &quot;broadcast: &quot; + action);<br/><br/>                  if (ping) {<br/>                      if (!c.getSharedPreferences(&quot;p&quot;, 0).getBoolean(&quot;wanted&quot;, false)) return;<br/>                  }<br/>                  <br/>                  if (!Settings.canDrawOverlays(c)) {<br/>                      PanelService.log(c, &quot;overlay permission missing&quot;);<br/>                      return;<br/>                  }<br/>                  <br/>                  if (!ping &amp;&amp; PanelService.isRunning()) {<br/>                      return;<br/>                  }<br/><br/>                  Intent s = new Intent(c, PanelService.class);<br/>                  if (ping) s.setAction(&quot;ping&quot;);<br/>                  try {<br/>                      if (android.os.Build.VERSION.SDK_INT &gt;= android.os.Build.VERSION_CODES.O) {<br/>                          c.startForegroundService(s);<br/>                      } else {<br/>                          c.startService(s);<br/>                      }<br/>                      PanelService.log(c, &quot;service started by: &quot; + action);<br/>                  } catch (Exception e) {<br/>                      PanelService.log(c, &quot;start failed: &quot; + e);<br/>                  }<br/>              }<br/>          }<br/>          EOF<br/><br/>          cat &gt; app/src/main/java/com/example/panel/PanelAccessibilityService.java &lt;&lt;&#39;EOF&#39;<br/>          package com.example.panel;<br/><br/>          import android.accessibilityservice.AccessibilityService;<br/>          import android.content.Intent;<br/>          import android.os.Build;<br/>          import android.view.accessibility.AccessibilityEvent;<br/><br/>          public class PanelAccessibilityService extends AccessibilityService {<br/>              @Override<br/>              public void onAccessibilityEvent(AccessibilityEvent event) {<br/>                  if (event.getEventType() == AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) {<br/>                      if (!PanelService.isRunning()) {<br/>                          PanelService.log(this, &quot;Accessibility watchdog: starting panel&quot;);<br/>                          Intent i = new Intent(this, PanelService.class);<br/>                          if (Build.VERSION.SDK_INT &gt;= Build.VERSION_CODES.O) {<br/>                              startForegroundService(i);<br/>                          } else {<br/>                              startService(i);<br/>                          }<br/>                      }<br/>                  }<br/>              }<br/><br/>              @Override<br/>              public void onInterrupt() {<br/>                  // Required override<br/>              }<br/>          }<br/>          EOF<br/><br/>          cat &gt; app/src/main/java/com/example/panel/PanelService.java &lt;&lt;&#39;EOF&#39;<br/>          package com.example.panel;<br/><br/>          import android.app.AlarmManager;<br/>          import android.app.Notification;<br/>          import android.app.NotificationChannel;<br/>          import android.app.NotificationManager;<br/>          import android.app.PendingIntent;<br/>          import android.app.Service;<br/>          import android.content.BroadcastReceiver;<br/>          import android.content.Context;<br/>          import android.content.Intent;<br/>          import android.content.IntentFilter;<br/>          import android.content.SharedPreferences;<br/>          import android.graphics.Color;<br/>          import android.graphics.PixelFormat;<br/>          import android.graphics.Typeface;<br/>          import android.graphics.drawable.GradientDrawable;<br/>          import android.net.Uri;<br/>          import android.os.Build;<br/>          import android.os.Handler;<br/>          import android.os.IBinder;<br/>          import android.os.Looper;<br/>          import android.os.SystemClock;<br/>          import android.provider.Settings;<br/>          import android.util.DisplayMetrics;<br/>          import android.view.Gravity;<br/>          import android.view.View;<br/>          import android.view.ViewGroup;<br/>          import android.view.WindowManager;<br/>          import android.widget.FrameLayout;<br/>          import android.widget.LinearLayout;<br/>          import android.widget.TextClock;<br/>          import android.widget.TextView;<br/>          import android.widget.Toast;<br/>          import java.text.SimpleDateFormat;<br/>          import java.util.Date;<br/>          import java.util.Locale;<br/><br/>          public class PanelService extends Service {<br/>              private static final int W = ViewGroup.LayoutParams.WRAP_CONTENT;<br/>              private static final int M = ViewGroup.LayoutParams.MATCH_PARENT;<br/>              private static String lastMsg = null;<br/>              private static volatile boolean isRunning = false;<br/><br/>              private static final String RADIO_PKG = &quot;com.your.radio&quot;;<br/><br/>              private WindowManager wm;<br/>              private View panel;<br/>              private View handle;<br/>              private BroadcastReceiver screenReceiver;<br/>              private boolean hidden = false;<br/>              private float dens = 1f;<br/>              private final Handler handler = new Handler(Looper.getMainLooper());<br/>              private final Runnable watchdog = new Runnable() {<br/>                  @Override<br/>                  public void run() {<br/>                      check();<br/>                      handler.postDelayed(this, 1500);<br/>                  }<br/>              };<br/><br/>              public static boolean isRunning() {<br/>                  return isRunning;<br/>              }<br/><br/>              public static void log(Context c, String m) {<br/>                  if (m.equals(lastMsg)) return;<br/>                  lastMsg = m;<br/>                  SharedPreferences p = c.getSharedPreferences(&quot;p&quot;, 0);<br/>                  String line = new SimpleDateFormat(&quot;HH:mm:ss&quot;, Locale.US).format(new Date()) + &quot; &quot; + m;<br/>                  String[] old = p.getString(&quot;log&quot;, &quot;&quot;).split(&quot;\n&quot;);<br/>                  StringBuilder sb = new StringBuilder(line);<br/>                  for (int k = 0; k &lt; old.length &amp;&amp; k &lt; 11; k++) {<br/>                      if (!old[k].isEmpty()) sb.append(&quot;\n&quot;).append(old[k]);<br/>                  }<br/>                  p.edit().putString(&quot;log&quot;, sb.toString()).apply();<br/>              }<br/><br/>              private static PendingIntent pingIntent(Context c) {<br/>                  Intent i = new Intent(c, BootReceiver.class);<br/>                  i.setAction(&quot;com.example.panel.PING&quot;);<br/>                  return PendingIntent.getBroadcast(c, 0, i, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);<br/>              }<br/><br/>              public static void schedulePing(Context c) {<br/>                  AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);<br/>                  long triggerAt = SystemClock.elapsedRealtime() + 10 * 60000;<br/>                  if (Build.VERSION.SDK_INT &gt;= 23) {<br/>                      am.setExactAndAllowWhileIdle(AlarmManager.ELAPSED_REALTIME_WAKEUP, triggerAt, pingIntent(c));<br/>                  } else {<br/>                      am.setExact(AlarmManager.ELAPSED_REALTIME_WAKEUP, triggerAt, pingIntent(c));<br/>                  }<br/>              }<br/><br/>              public static void cancelPing(Context c) {<br/>                  AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);<br/>                  am.cancel(pingIntent(c));<br/>              }<br/><br/>              @Override<br/>              public IBinder onBind(Intent i) {<br/>                  return null;<br/>              }<br/><br/>              @Override<br/>              public int onStartCommand(Intent i, int f, int id) {<br/>                  isRunning = true;<br/>                  boolean ping = i != null &amp;&amp; &quot;ping&quot;.equals(i.getAction());<br/>                  NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);<br/>                  nm.createNotificationChannel(new NotificationChannel(&quot;panel&quot;, &quot;Bottom panel&quot;,<br/>                          NotificationManager.IMPORTANCE_MIN));<br/>                  Notification n = new Notification.Builder(this, &quot;panel&quot;)<br/>                          .setContentTitle(&quot;Bottom panel is running&quot;)<br/>                          .setSmallIcon(android.R.drawable.ic_dialog_info)<br/>                          .build();<br/>                  startForeground(1, n);<br/>                  <br/>                  if (!Settings.canDrawOverlays(this)) {<br/>                      log(this, &quot;overlay permission missing&quot;);<br/>                      stopSelf();<br/>                      return START_NOT_STICKY;<br/>                  }<br/>                  <br/>                  wm = (WindowManager) getSystemService(WINDOW_SERVICE);<br/>                  dens = getResources().getDisplayMetrics().density;<br/>                  getSharedPreferences(&quot;p&quot;, 0).edit().putBoolean(&quot;wanted&quot;, true).apply();<br/>                  schedulePing(this);<br/>                  registerScreenReceiver();<br/>                  <br/>                  if (ping &amp;&amp; (panel != null || handle != null)) {<br/>                      return START_STICKY;<br/>                  }<br/>                  <br/>                  log(this, i == null ? &quot;service restarted by system&quot;<br/>                          : ping ? &quot;service revived by keep-alive&quot; : &quot;service started&quot;);<br/>                  hidden = false;<br/>                  build();<br/>                  <br/>                  if (!ping) maybeLaunchRadio();<br/>                  handler.removeCallbacks(watchdog);<br/>                  handler.postDelayed(watchdog, 1500);<br/>                  return START_STICKY;<br/>              }<br/><br/>              @Override<br/>              public void onDestroy() {<br/>                  isRunning = false;<br/>                  handler.removeCallbacks(watchdog);<br/>                  if (screenReceiver != null) {<br/>                      try {<br/>                          unregisterReceiver(screenReceiver);<br/>                      } catch (Exception ignored) {}<br/>                      screenReceiver = null;<br/>                  }<br/>                  log(this, &quot;service destroyed&quot;);<br/>                  clear();<br/>                  super.onDestroy();<br/>              }<br/><br/>              private void registerScreenReceiver() {<br/>                  if (screenReceiver != null) return;<br/>                  screenReceiver = new BroadcastReceiver() {<br/>                      @Override<br/>                      public void onReceive(Context c, Intent i) {<br/>                          if (!Intent.ACTION_SCREEN_ON.equals(i.getAction()) || wm == null) return;<br/>                          if (!hidden &amp;&amp; (panel == null || !panel.isAttachedToWindow())) {<br/>                              log(PanelService.this, &quot;screen on - re-adding panel&quot;);<br/>                              build();<br/>                          } else if (hidden &amp;&amp; (handle == null || !handle.isAttachedToWindow())) {<br/>                              log(PanelService.this, &quot;screen on - re-adding handle&quot;);<br/>                              build();<br/>                          }<br/>                      }<br/>                  };<br/>                  try {<br/>                      registerReceiver(screenReceiver, new IntentFilter(Intent.ACTION_SCREEN_ON));<br/>                  } catch (Exception ignored) {}<br/>              }<br/><br/>              private void check() {<br/>                  if (wm == null) return;<br/>                  if (hidden) {<br/>                      if (handle == null || !handle.isAttachedToWindow()) {<br/>                          log(this, &quot;handle missing - re-adding&quot;);<br/>                          build();<br/>                      }<br/>                  } else {<br/>                      if (panel == null || !panel.isAttachedToWindow()) {<br/>                          log(this, &quot;panel window gone - re-adding&quot;);<br/>                          build();<br/>                      }<br/>                  }<br/>              }<br/><br/>              private int px(float dp) {<br/>                  return Math.round(dp * dens);<br/>              }<br/><br/>              private void remove(View v) {<br/>                  if (v != null &amp;&amp; wm != null) {<br/>                      try { wm.removeView(v); } catch (Exception ignored) {}<br/>                  }<br/>              }<br/><br/>              private void clear() {<br/>                  remove(panel);<br/>                  remove(handle);<br/>                  panel = null;<br/>                  handle = null;<br/>              }<br/><br/>              private WindowManager.LayoutParams lp(int w, int h, int gravity, int x, int y) {<br/>                  WindowManager.LayoutParams l = new WindowManager.LayoutParams(w, h,<br/>                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,<br/>                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE<br/>                                  | WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL<br/>                                  | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN<br/>                                  | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,<br/>                          PixelFormat.TRANSLUCENT);<br/>                  l.gravity = gravity;<br/>                  l.x = x;<br/>                  l.y = y;<br/>                  return l;<br/>              }<br/><br/>              private void build() {<br/>                  clear();<br/>                  SharedPreferences p = getSharedPreferences(&quot;p&quot;, 0);<br/>                  int hDp = p.getInt(&quot;height&quot;, 170);<br/>                  int sDp = p.getInt(&quot;side&quot;, 200);<br/>                  DisplayMetrics real = new DisplayMetrics();<br/>                  wm.getDefaultDisplay().getRealMetrics(real);<br/>                  if (hidden) {<br/>                      addHandle(real);<br/>                  } else {<br/>                      addPanel(real, hDp, sDp);<br/>                  }<br/>              }<br/><br/>              private void addHandle(DisplayMetrics real) {<br/>                  TextView t = new TextView(this);<br/>                  t.setText(&quot;Show panel&quot;);<br/>                  t.setTextColor(Color.WHITE);<br/>                  t.setTextSize(16);<br/>                  t.setGravity(Gravity.CENTER);<br/>                  t.setBackgroundColor(Color.rgb(60, 66, 76));<br/>                  t.setOnClickListener(v -&gt; {<br/>                      hidden = false;<br/>                      build();<br/>                  });<br/>                  int h = px(44);<br/>                  try {<br/>                      wm.addView(t, lp(px(150), h, Gravity.TOP | Gravity.CENTER_HORIZONTAL, 0, real.heightPixels - h));<br/>                      handle = t;<br/>                  } catch (Exception e) {<br/>                      log(this, &quot;handle addView failed: &quot; + e);<br/>                  }<br/>              }<br/><br/>              private void addPanel(DisplayMetrics real, int hDp, int sDp) {<br/>                  int h = px(hDp);<br/>                  int size = px(Math.max(40, Math.min(100, hDp - 20)));<br/>                  FrameLayout root = new FrameLayout(this);<br/>                  root.setBackgroundColor(Color.rgb(16, 20, 24));<br/>                  root.setPadding(px(sDp), 0, px(sDp), 0);<br/><br/>                  LinearLayout left = row();<br/>                  left.addView(tile(&quot;Home&quot;, Color.rgb(240, 110, 60), size, v -&gt; goHome()));<br/>                  left.addView(tile(&quot;Apps&quot;, Color.rgb(40, 110, 230), size,<br/>                          v -&gt; go(new Intent(this, AppsActivity.class))));<br/>                  root.addView(left, new FrameLayout.LayoutParams(W, W, Gravity.START | Gravity.CENTER_VERTICAL));<br/><br/>                  LinearLayout clock = new LinearLayout(this);<br/>                  clock.setOrientation(LinearLayout.VERTICAL);<br/>                  clock.setGravity(Gravity.CENTER_HORIZONTAL);<br/>                  TextClock time = new TextClock(this);<br/>                  time.setFormat12Hour(&quot;h:mm&quot;);<br/>                  time.setFormat24Hour(&quot;HH:mm&quot;);<br/>                  time.setTextColor(Color.WHITE);<br/>                  time.setTextSize(44);<br/>                  time.setTypeface(Typeface.DEFAULT_BOLD);<br/>                  time.setGravity(Gravity.CENTER);<br/>                  TextClock date = new TextClock(this);<br/>                  date.setFormat12Hour(&quot;EEE, d MMM yyyy&quot;);<br/>                  date.setFormat24Hour(&quot;EEE, d MMM yyyy&quot;);<br/>                  date.setTextColor(Color.rgb(180, 190, 200));<br/>                  date.setTextSize(16);<br/>                  date.setGravity(Gravity.CENTER);<br/>                  clock.addView(time, new LinearLayout.LayoutParams(W, W));<br/>                  clock.addView(date, new LinearLayout.LayoutParams(W, W));<br/>                  root.addView(clock, new FrameLayout.LayoutParams(W, W, Gravity.CENTER));<br/><br/>                  LinearLayout right = row();<br/>                  right.addView(tile(&quot;Maps&quot;, Color.rgb(0, 150, 160), size, v -&gt; openMaps()));<br/>                  right.addView(tile(&quot;Phone&quot;, Color.rgb(50, 180, 70), size,<br/>                          v -&gt; go(new Intent(Intent.ACTION_DIAL))));<br/>                  right.addView(tile(&quot;Hide&quot;, Color.rgb(90, 98, 110), size, v -&gt; {<br/>                      hidden = true;<br/>                      build();<br/>                  }));<br/>                  root.addView(right, new FrameLayout.LayoutParams(W, W, Gravity.END | Gravity.CENTER_VERTICAL));<br/><br/>                  try {<br/>                      wm.addView(root, lp(M, h, Gravity.TOP | Gravity.LEFT, 0, real.heightPixels - h));<br/>                      panel = root;<br/>                  } catch (Exception e) {<br/>                      log(this, &quot;panel addView failed: &quot; + e);<br/>                  }<br/>              }<br/><br/>              private LinearLayout row() {<br/>                  LinearLayout l = new LinearLayout(this);<br/>                  l.setOrientation(LinearLayout.HORIZONTAL);<br/>                  l.setGravity(Gravity.CENTER_VERTICAL);<br/>                  return l;<br/>              }<br/><br/>              private TextView tile(String label, int color, int size, View.OnClickListener l) {<br/>                  TextView t = new TextView(this);<br/>                  t.setText(label);<br/>                  t.setTextColor(Color.WHITE);<br/>                  t.setTextSize(17);<br/>                  t.setTypeface(Typeface.DEFAULT_BOLD);<br/>                  t.setGravity(Gravity.CENTER);<br/>                  GradientDrawable g = new GradientDrawable();<br/>                  g.setColor(color);<br/>                  g.setCornerRadius(px(16));<br/>                  t.setBackground(g);<br/>                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(size, size);<br/>                  p.setMargins(px(6), 0, px(6), 0);<br/>                  t.setLayoutParams(p);<br/>                  t.setOnClickListener(l);<br/>                  return t;<br/>              }<br/><br/>              private void go(Intent i) {<br/>                  try {<br/>                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);<br/>                      startActivity(i);<br/>                  } catch (Exception e) {<br/>                      Toast.makeText(this, &quot;Cannot open: &quot; + e.getMessage(), Toast.LENGTH_LONG).show();<br/>                  }<br/>              }<br/><br/>              private void goHome() {<br/>                  Intent h = new Intent(Intent.ACTION_MAIN);<br/>                  h.addCategory(Intent.CATEGORY_HOME);<br/>                  go(h);<br/>              }<br/><br/>              private void openMaps() {<br/>                  Intent m = getPackageManager().getLaunchIntentForPackage(&quot;com.google.android.apps.maps&quot;);<br/>                  if (m == null) {<br/>                      m = new Intent(Intent.ACTION_VIEW, Uri.parse(&quot;geo:0,0?q=&quot;));<br/>                  }<br/>                  go(m);<br/>              }<br/><br/>              private void maybeLaunchRadio() {<br/>                  long bootTime = System.currentTimeMillis() - SystemClock.elapsedRealtime();<br/>                  SharedPreferences p = getSharedPreferences(&quot;p&quot;, 0);<br/>                  long lastLaunch = p.getLong(&quot;lastBootLaunch&quot;, 0);<br/>                  if (Math.abs(bootTime - lastLaunch) &lt; 60000) return;<br/>                  p.edit().putLong(&quot;lastBootLaunch&quot;, bootTime).apply();<br/>                  handler.postDelayed(() -&gt; {<br/>                      Intent i = getPackageManager().getLaunchIntentForPackage(RADIO_PKG);<br/>                      if (i != null) {<br/>                          i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);<br/>                          try {<br/>                              startActivity(i);<br/>                              log(this, &quot;launched radio app&quot;);<br/>                          } catch (Exception e) {<br/>                              log(this, &quot;radio launch failed: &quot; + e);<br/>                          }<br/>                      } else {<br/>                          log(this, &quot;radio package not found: &quot; + RADIO_PKG);<br/>                      }<br/>                  }, 4000);<br/>              }<br/>          }<br/>          EOF<br/><br/>          cat &gt; app/src/main/java/com/example/panel/AppsActivity.java &lt;&lt;&#39;EOF&#39;<br/>          package com.example.panel;<br/><br/>          import android.app.Activity;<br/>          import android.content.Intent;<br/>          import android.content.pm.PackageManager;<br/>          import android.content.pm.ResolveInfo;<br/>          import android.graphics.Color;<br/>          import android.os.Bundle;<br/>          import android.view.Gravity;<br/>          import android.view.View;<br/>          import android.view.ViewGroup;<br/>          import android.widget.BaseAdapter;<br/>          import android.widget.GridView;<br/>          import android.widget.ImageView;<br/>          import android.widget.LinearLayout;<br/>          import android.widget.TextView;<br/>          import android.widget.Toast;<br/>          import java.util.Collections;<br/>          import java.util.List;<br/><br/>          public class AppsActivity extends Activity {<br/>              @Override<br/>              protected void onCreate(Bundle b) {<br/>                  super.onCreate(b);<br/>                  final PackageManager pm = getPackageManager();<br/>                  Intent mi = new Intent(Intent.ACTION_MAIN);<br/>                  mi.addCategory(Intent.CATEGORY_LAUNCHER);<br/>                  final List&lt;ResolveInfo&gt; apps = pm.queryIntentActivities(mi, 0);<br/>                  Collections.sort(apps, new ResolveInfo.DisplayNameComparator(pm));<br/>                  final float d = getResources().getDisplayMetrics().density;<br/><br/>                  GridView g = new GridView(this);<br/>                  g.setBackgroundColor(Color.rgb(16, 20, 24));<br/>                  g.setNumColumns(6);<br/>                  int pad = (int) (16 * d);<br/>                  g.setPadding(pad, pad, pad, pad);<br/>                  g.setVerticalSpacing((int) (12 * d));<br/>                  g.setAdapter(new BaseAdapter() {<br/>                      @Override<br/>                      public int getCount() { return apps.size(); }<br/>                      @Override<br/>                      public Object getItem(int i) { return apps.get(i); }<br/>                      @Override<br/>                      public long getItemId(int i) { return i; }<br/>                      @Override<br/>                      public View getView(int i, View c, ViewGroup parent) {<br/>                          ResolveInfo ri = apps.get(i);<br/>                          LinearLayout l = new LinearLayout(AppsActivity.this);<br/>                          l.setOrientation(LinearLayout.VERTICAL);<br/>                          l.setGravity(Gravity.CENTER_HORIZONTAL);<br/>                          ImageView iv = new ImageView(AppsActivity.this);<br/>                          iv.setImageDrawable(ri.loadIcon(pm));<br/>                          l.addView(iv, new LinearLayout.LayoutParams((int) (56 * d), (int) (56 * d)));<br/>                          TextView t = new TextView(AppsActivity.this);<br/>                          t.setText(ri.loadLabel(pm));<br/>                          t.setTextColor(Color.WHITE);<br/>                          t.setTextSize(12);<br/>                          t.setSingleLine(true);<br/>                          t.setGravity(Gravity.CENTER);<br/>                          l.addView(t, new LinearLayout.LayoutParams(<br/>                                  ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT));<br/>                          return l;<br/>                      }<br/>                  });<br/>                  g.setOnItemClickListener((parent, v, i, id) -&gt; {<br/>                      ResolveInfo ri = apps.get(i);<br/>                      Intent li = new Intent(Intent.ACTION_MAIN);<br/>                      li.addCategory(Intent.CATEGORY_LAUNCHER);<br/>                      li.setClassName(ri.activityInfo.packageName, ri.activityInfo.name);<br/>                      li.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);<br/>                      try {<br/>                          startActivity(li);<br/>                      } catch (Exception e) {<br/>                          Toast.makeText(this, &quot;Cannot open: &quot; + e.getMessage(), Toast.LENGTH_LONG).show();<br/>                      }<br/>                      finish();<br/>                  });<br/>                  setContentView(g);<br/>              }<br/>          }<br/>          EOF<br/><br/>          cat &gt; app/src/main/java/com/example/panel/MainActivity.java &lt;&lt;&#39;EOF&#39;<br/>          package com.example.panel;<br/><br/>          import android.app.Activity;<br/>          import android.content.ActivityNotFoundException;<br/>          import android.content.Intent;<br/>          import android.content.SharedPreferences;<br/>          import android.graphics.Typeface;<br/>          import android.net.Uri;<br/>          import android.os.Bundle;<br/>          import android.provider.Settings;<br/>          import android.view.Gravity;<br/>          import android.view.View;<br/>          import android.widget.Button;<br/>          import android.widget.LinearLayout;<br/>          import android.widget.ScrollView;<br/>          import android.widget.TextView;<br/>          import android.widget.Toast;<br/><br/>          public class MainActivity extends Activity {<br/>              private SharedPreferences p;<br/>              private TextView status;<br/>              private TextView hTv;<br/>              private TextView sTv;<br/>              private TextView logTv;<br/>              private Button bootBtn;<br/><br/>              @Override<br/>              protected void onCreate(Bundle b) {<br/>                  super.onCreate(b);<br/>                  p = getSharedPreferences(&quot;p&quot;, 0);<br/>                  ScrollView sv = new ScrollView(this);<br/>                  LinearLayout root = new LinearLayout(this);<br/>                  root.setOrientation(LinearLayout.VERTICAL);<br/>                  root.setPadding(24, 24, 24, 24);<br/><br/>                  status = new TextView(this);<br/>                  status.setTextSize(15);<br/>                  root.addView(status);<br/><br/>                  root.addView(btn(&quot;1) Grant overlay permission&quot;, v -&gt; askOverlay()));<br/>                  root.addView(btn(&quot;2) Allow Background (Disable Battery Opt)&quot;, v -&gt; askBatteryOpt()));<br/>                  root.addView(btn(&quot;3) Enable Wake Watchdog (Accessibility)&quot;, v -&gt; askAccessibility()));<br/>                  root.addView(btn(&quot;4) Start / refresh panel&quot;, v -&gt; startPanel()));<br/>                  root.addView(btn(&quot;Stop panel&quot;, v -&gt; stopPanel()));<br/><br/>                  hTv = new TextView(this);<br/>                  hTv.setTextSize(16);<br/>                  hTv.setGravity(Gravity.CENTER);<br/>                  root.addView(stepper(hTv, &quot;height&quot;, 170, 60, 250, 10));<br/><br/>                  sTv = new TextView(this);<br/>                  sTv.setTextSize(16);<br/>                  sTv.setGravity(Gravity.CENTER);<br/>                  root.addView(stepper(sTv, &quot;side&quot;, 200, 0, 400, 20));<br/><br/>                  bootBtn = btn(&quot;&quot;, v -&gt; {<br/>                      p.edit().putBoolean(&quot;boot&quot;, !p.getBoolean(&quot;boot&quot;, true)).apply();<br/>                      refresh();<br/>                  });<br/>                  root.addView(bootBtn);<br/>                  root.addView(btn(&quot;Open app grid&quot;, v -&gt; startActivity(new Intent(this, AppsActivity.class))));<br/>                  root.addView(btn(&quot;Refresh log&quot;, v -&gt; refresh()));<br/><br/>                  logTv = new TextView(this);<br/>                  logTv.setTextSize(13);<br/>                  logTv.setTypeface(Typeface.MONOSPACE);<br/>                  root.addView(logTv);<br/><br/>                  sv.addView(root);<br/>                  setContentView(sv);<br/>              }<br/><br/>              @Override<br/>              protected void onResume() {<br/>                  super.onResume();<br/>                  refresh();<br/>              }<br/><br/>              private Button btn(String t, View.OnClickListener l) {<br/>                  Button x = new Button(this);<br/>                  x.setText(t);<br/>                  x.setAllCaps(false);<br/>                  x.setOnClickListener(l);<br/>                  return x;<br/>              }<br/><br/>              private LinearLayout stepper(TextView label, String key, int def, int min, int max, int step) {<br/>                  LinearLayout r = new LinearLayout(this);<br/>                  r.setOrientation(LinearLayout.HORIZONTAL);<br/>                  r.addView(btn(&quot;-&quot;, v -&gt; change(key, def, -step, min, max)));<br/>                  r.addView(label, new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f));<br/>                  r.addView(btn(&quot;+&quot;, v -&gt; change(key, def, step, min, max)));<br/>                  return r;<br/>              }<br/><br/>              private void change(String key, int def, int delta, int min, int max) {<br/>                  int v = Math.max(min, Math.min(max, p.getInt(key, def) + delta));<br/>                  p.edit().putInt(key, v).apply();<br/>                  refresh();<br/>                  if (Settings.canDrawOverlays(this)) {<br/>                      startPanel();<br/>                  }<br/>              }<br/><br/>              private void refresh() {<br/>                  status.setText(&quot;Overlay permission: &quot; + Settings.canDrawOverlays(this));<br/>                  hTv.setText(&quot;Panel height: &quot; + p.getInt(&quot;height&quot;, 170) + &quot; dp&quot;);<br/>                  sTv.setText(&quot;Side margin (knob clearance): &quot; + p.getInt(&quot;side&quot;, 200) + &quot; dp&quot;);<br/>                  bootBtn.setText(&quot;Auto-start on boot: &quot; + (p.getBoolean(&quot;boot&quot;, true) ? &quot;ON&quot; : &quot;OFF&quot;));<br/>                  logTv.setText(&quot;Event log (newest first):\n&quot; + p.getString(&quot;log&quot;, &quot;(empty)&quot;));<br/>              }<br/><br/>              private void askOverlay() {<br/>                  try {<br/>                      startActivity(new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION,<br/>                              Uri.parse(&quot;package:&quot; + getPackageName())));<br/>                  } catch (ActivityNotFoundException e) {<br/>                      Toast.makeText(this, &quot;No overlay settings screen. Try manually.&quot;, Toast.LENGTH_LONG).show();<br/>                  }<br/>              }<br/><br/>              private void askBatteryOpt() {<br/>                  if (android.os.Build.VERSION.SDK_INT &gt;= android.os.Build.VERSION_CODES.M) {<br/>                      Intent intent = new Intent();<br/>                      String packageName = getPackageName();<br/>                      android.os.PowerManager pm = (android.os.PowerManager) getSystemService(POWER_SERVICE);<br/>                      if (!pm.isIgnoringBatteryOptimizations(packageName)) {<br/>                          intent.setAction(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS);<br/>                          intent.setData(Uri.parse(&quot;package:&quot; + packageName));<br/>                          startActivity(intent);<br/>                      } else {<br/>                          Toast.makeText(this, &quot;Battery optimization already disabled!&quot;, Toast.LENGTH_SHORT).show();<br/>                      }<br/>                  }<br/>              }<br/><br/>              private void askAccessibility() {<br/>                  try {<br/>                      startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS));<br/>                      Toast.makeText(this, &quot;Find &#39;Bottom Panel&#39; and turn it ON&quot;, Toast.LENGTH_LONG).show();<br/>                  } catch (Exception e) {<br/>                      Toast.makeText(this, &quot;Cannot open Accessibility settings&quot;, Toast.LENGTH_LONG).show();<br/>                  }<br/>              }<br/><br/>              private void startPanel() {<br/>                  if (!Settings.canDrawOverlays(this)) {<br/>                      Toast.makeText(this, &quot;Grant overlay permission first (button 1)&quot;, Toast.LENGTH_LONG).show();<br/>                      return;<br/>                  }<br/>                  startForegroundService(new Intent(this, PanelService.class));<br/>              }<br/><br/>              private void stopPanel() {<br/>                  p.edit().putBoolean(&quot;wanted&quot;, false).apply();<br/>                  PanelService.cancelPing(this);<br/>                  stopService(new Intent(this, PanelService.class));<br/>                  PanelService.log(this, &quot;stopped by user&quot;);<br/>                  refresh();<br/>              }<br/>          }<br/>          EOF<br/><br/>      - name: Build APK<br/>        working-directory: panel<br/>        run: gradle assembleDebug --no-daemon<br/><br/>      - name: Upload APK<br/>        uses: actions/upload-artifact@v4<br/>        with:<br/>          name: bottom-panel-apk<br/>          path: panel/app/build/outputs/apk/debug/app-debug.apk<br/><br/>      - name: Publish APK as a release<br/>        uses: softprops/action-gh-release@v2<br/>        with:<br/>          tag_name: panel-${{ github.run_number }}<br/>          name: Bottom Panel APK ${{ github.run_number }}<br/>          files: panel/app/build/outputs/apk/debug/app-debug.apk<br/>          fail_on_unmatched_files: true</body>
