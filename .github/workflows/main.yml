name: Build diagnostic APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Create project files
        run: |
          mkdir -p diag/app/src/main/java/com/example/diag
          cd diag

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Diag"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.example.diag'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.example.diag'
                  minSdk 29
                  targetSdk 29
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <application
                  android:label="Screen Diag"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/diag/MainActivity.java <<'EOF'
          package com.example.diag;

          import android.app.Activity;
          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.PixelFormat;
          import android.graphics.Point;
          import android.graphics.Rect;
          import android.graphics.Typeface;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.util.DisplayMetrics;
          import android.view.Display;
          import android.view.Gravity;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              private TextView tv;
              private TextView bar;
              private LinearLayout root;
              private String insets = "(not received yet)";
              private String last = "";

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  ScrollView sv = new ScrollView(this);
                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(24, 24, 24, 24);

                  tv = new TextView(this);
                  tv.setTextSize(13);
                  tv.setTypeface(Typeface.MONOSPACE);
                  root.addView(tv);

                  root.addView(btn("Refresh", v -> report()));
                  root.addView(btn("1) Grant overlay permission", v -> askOverlay()));
                  root.addView(btn("2) Show test bar at screen bottom (170 px)",
                          v -> addBar(Gravity.BOTTOM | Gravity.LEFT, 0, 170)));
                  root.addView(btn("3) Show test bar in gap below app area", v -> gapBar()));
                  root.addView(btn("Hide test bar", v -> hideBar()));

                  sv.addView(root);
                  setContentView(sv);

                  sv.setOnApplyWindowInsetsListener((v, i) -> {
                      insets = "sys L" + i.getSystemWindowInsetLeft()
                              + " T" + i.getSystemWindowInsetTop()
                              + " R" + i.getSystemWindowInsetRight()
                              + " B" + i.getSystemWindowInsetBottom()
                              + " | stable T" + i.getStableInsetTop()
                              + " B" + i.getStableInsetBottom()
                              + " | cutout=" + (i.getDisplayCutout() != null);
                      return v.onApplyWindowInsets(i);
                  });
                  root.getViewTreeObserver().addOnGlobalLayoutListener(this::report);
              }

              private Button btn(String t, View.OnClickListener l) {
                  Button x = new Button(this);
                  x.setText(t);
                  x.setAllCaps(false);
                  x.setOnClickListener(l);
                  return x;
              }

              private void askOverlay() {
                  try {
                      startActivity(new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse("package:" + getPackageName())));
                  } catch (ActivityNotFoundException e) {
                      Toast.makeText(this,
                              "No overlay settings screen. Try Settings > Apps > Screen Diag > Display over other apps",
                              Toast.LENGTH_LONG).show();
                  }
              }

              private void gapBar() {
                  Display d = getWindowManager().getDefaultDisplay();
                  DisplayMetrics real = new DisplayMetrics();
                  d.getRealMetrics(real);
                  Rect vis = new Rect();
                  getWindow().getDecorView().getWindowVisibleDisplayFrame(vis);
                  int h = real.heightPixels - vis.bottom;
                  if (h < 20) {
                      Toast.makeText(this, "No gap detected by Android; using bottom 170 px", Toast.LENGTH_LONG).show();
                      addBar(Gravity.BOTTOM | Gravity.LEFT, 0, 170);
                  } else {
                      addBar(Gravity.TOP | Gravity.LEFT, vis.bottom, h);
                  }
              }

              private void addBar(int gravity, int y, int h) {
                  if (!Settings.canDrawOverlays(this)) {
                      Toast.makeText(this, "Grant overlay permission first (button 1)", Toast.LENGTH_LONG).show();
                      return;
                  }
                  hideBar();
                  WindowManager wm = (WindowManager) getApplicationContext().getSystemService(WINDOW_SERVICE);
                  TextView t = new TextView(getApplicationContext());
                  t.setText("TEST BAR - can you see me?");
                  t.setTextColor(Color.WHITE);
                  t.setTextSize(26);
                  t.setGravity(Gravity.CENTER);
                  t.setBackgroundColor(Color.rgb(255, 0, 200));
                  WindowManager.LayoutParams lp = new WindowManager.LayoutParams(
                          WindowManager.LayoutParams.MATCH_PARENT, h,
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                                  | WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL
                                  | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN
                                  | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                          PixelFormat.OPAQUE);
                  lp.gravity = gravity;
                  lp.y = y;
                  try {
                      wm.addView(t, lp);
                      bar = t;
                      t.postDelayed(this::report, 500);
                  } catch (Exception e) {
                      Toast.makeText(this, "addView failed: " + e, Toast.LENGTH_LONG).show();
                  }
              }

              private void hideBar() {
                  if (bar != null) {
                      try {
                          ((WindowManager) getApplicationContext().getSystemService(WINDOW_SERVICE)).removeView(bar);
                      } catch (Exception ignored) {
                      }
                      bar = null;
                  }
                  report();
              }

              private void report() {
                  Display d = getWindowManager().getDefaultDisplay();
                  DisplayMetrics real = new DisplayMetrics();
                  d.getRealMetrics(real);
                  DisplayMetrics app = new DisplayMetrics();
                  d.getMetrics(app);
                  Point rs = new Point();
                  d.getRealSize(rs);
                  Point as = new Point();
                  d.getSize(as);
                  View decor = getWindow().getDecorView();
                  Rect vis = new Rect();
                  decor.getWindowVisibleDisplayFrame(vis);
                  int[] dl = new int[2];
                  decor.getLocationOnScreen(dl);
                  View content = findViewById(android.R.id.content);
                  int[] cl = new int[2];
                  content.getLocationOnScreen(cl);
                  int ui = decor.getSystemUiVisibility();
                  int wf = getWindow().getAttributes().flags;
                  DisplayMetrics rm = getResources().getDisplayMetrics();

                  StringBuilder s = new StringBuilder();
                  s.append("PHYSICAL (getRealMetrics): ").append(real.widthPixels).append(" x ").append(real.heightPixels).append("\n");
                  s.append("PHYSICAL (getRealSize):    ").append(rs.x).append(" x ").append(rs.y).append("\n");
                  s.append("APP AREA (getMetrics):     ").append(app.widthPixels).append(" x ").append(app.heightPixels).append("\n");
                  s.append("APP AREA (getSize):        ").append(as.x).append(" x ").append(as.y).append("\n");
                  s.append("Resources metrics:         ").append(rm.widthPixels).append(" x ").append(rm.heightPixels)
                          .append("  dpi ").append(rm.densityDpi).append("\n");
                  s.append("Window decor view:         ").append(decor.getWidth()).append(" x ").append(decor.getHeight())
                          .append(" at y=").append(dl[1]).append("\n");
                  s.append("Root content view:         ").append(content.getWidth()).append(" x ").append(content.getHeight())
                          .append(" at y=").append(cl[1]).append("\n");
                  s.append("Visible frame:             ").append(vis.toShortString()).append("\n");
                  s.append("Insets: ").append(insets).append("\n");
                  s.append("Immersive/hide flags: sticky=").append((ui & View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY) != 0)
                          .append(" fullscreen=").append((ui & View.SYSTEM_UI_FLAG_FULLSCREEN) != 0)
                          .append(" hideNav=").append((ui & View.SYSTEM_UI_FLAG_HIDE_NAVIGATION) != 0)
                          .append(" winFullscreen=").append((wf & WindowManager.LayoutParams.FLAG_FULLSCREEN) != 0).append("\n");
                  s.append("Gap physical height - visible bottom: ").append(real.heightPixels - vis.bottom).append(" px\n");
                  s.append("Overlay permission: ").append(Settings.canDrawOverlays(this)).append("\n");
                  if (bar != null) {
                      int[] bl = new int[2];
                      bar.getLocationOnScreen(bl);
                      s.append("Test bar: ").append(bar.getWidth()).append(" x ").append(bar.getHeight())
                              .append(" at y=").append(bl[1]).append("\n");
                  } else {
                      s.append("Test bar: not shown\n");
                  }
                  String out = s.toString();
                  if (!out.equals(last)) {
                      last = out;
                      tv.setText(out);
                  }
              }
          }
          EOF

      - name: Build APK
        working-directory: diag
        run: gradle assembleDebug --no-daemon

      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: diag-${{ github.run_number }}
          name: Diagnostic APK ${{ github.run_number }}
          files: diag/app/build/outputs/apk/debug/app-debug.apk
